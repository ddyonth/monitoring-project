name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  test:
    name: Tests (ubuntu, Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Стиль показывается, но пайплайн не блокирует
      - name: Lint (ruff, non-blocking)
        continue-on-error: true
        run: ruff check --output-format=github .

      - name: Run tests
        run: python -m pytest server/tests -v

  build-windows-agent:
    name: Build Windows agent (PyInstaller)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Относительные пути внутри spec (client_agent.py) PyInstaller резолвит
      # от каталога spec-файла, а dist/build — от текущего каталога, поэтому
      # задаём их явно.
      - name: Build client_agent.exe
        run: pyinstaller client/client_agent.spec --distpath client/dist --workpath client/build --noconfirm

      - name: Check build output
        run: |
          if (-not (Test-Path client/dist/client_agent.exe)) { throw "client_agent.exe not found" }
          Get-Item client/dist/client_agent.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: client_agent-windows
          path: client/dist/client_agent.exe
          if-no-files-found: error
