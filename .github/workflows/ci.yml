name: CI

on:
  push:
    # feature/** — чтобы test/build/e2e давали сигнал до открытия PR;
    # publish-client-release защищена своим условием (только push в master)
    branches: [develop, master, 'feature/**']
  pull_request:
    branches: [develop, master]

jobs:
  test:
    name: Tests (ubuntu, Python 3.11)
    runs-on: ubuntu-latest
    services:
      # Тесты гоняются против настоящего Postgres (та же мажорная версия и
      # локаль, что в docker-compose.yml); conftest создаёт БД monitoring_test
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: monitoring
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: monitoring
          POSTGRES_INITDB_ARGS: "--locale=C.UTF-8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monitoring -d monitoring"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Стиль показывается, но пайплайн не блокирует
      - name: Lint (ruff, non-blocking)
        continue-on-error: true
        run: ruff check --output-format=github .

      - name: Run tests
        env:
          MONITORING_TEST_DATABASE_URL: postgresql://monitoring:ci_password@localhost:5432/monitoring_test
        run: python -m pytest server/tests client/tests -v

  build-windows-agent:
    name: Build Windows agent (PyInstaller)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Относительные пути внутри spec (client_agent.py) PyInstaller резолвит
      # от каталога spec-файла, а dist/build — от текущего каталога, поэтому
      # задаём их явно.
      - name: Build client_agent.exe
        run: pyinstaller client/client_agent.spec --distpath client/dist --workpath client/build --noconfirm

      - name: Check build output
        run: |
          if (-not (Test-Path client/dist/client_agent.exe)) { throw "client_agent.exe not found" }
          Get-Item client/dist/client_agent.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: client_agent-windows
          path: client/dist/client_agent.exe
          if-no-files-found: error

  # Сквозная проверка самообновления на настоящей Windows: собирает две версии
  # exe (текущую из client/VERSION и следующую), поднимает стаб сервера релизов
  # и запускает старую exe с --apply-update-now — она должна заменить саму себя
  # новой, перезапустить её, а релиз с неверным sha256 отвергнуть.
  # Стаб слушает 127.0.0.1:8000 — встроенный адрес сервера по умолчанию:
  # тест не задаёт MONITORING_SERVER_URL и проверяет exe в поставочной конфигурации.
  # Не зависит от build-windows-agent: собирает свои exe сама.
  # Планировщик заданий (AtLogOn/watchdog) сюда не входит — на раннере нет
  # интерактивной сессии входа, это остаётся ручной проверкой.
  selfupdate-e2e-windows:
    name: Self-update end-to-end (windows-latest, real exe)
    runs-on: windows-latest
    env:
      # Консоль раннера — cp1252; вывод теста и агента (кириллица) должен быть UTF-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # "Старая" версия — client/VERSION как в репозитории
      - name: Build current version (old)
        run: pyinstaller client/client_agent.spec --distpath client/dist/old --workpath client/build/old --noconfirm

      # "Новая" версия — последний компонент client/VERSION + 1 (1.2 -> 1.3,
      # 1.2.1 -> 1.2.2); файл возвращается на место шагом ниже.
      - name: Bump client/VERSION and build next version (new)
        id: new_version
        shell: bash
        run: |
          old="$(tr -d '[:space:]' < client/VERSION)"
          new="${old%.*}.$(( ${old##*.} + 1 ))"
          echo "$new" > client/VERSION
          echo "old=$old new=$new"
          echo "version=$new" >> "$GITHUB_OUTPUT"
          pyinstaller client/client_agent.spec --distpath client/dist/new --workpath client/build/new --noconfirm

      - name: Restore client/VERSION
        if: always()
        shell: bash
        run: |
          git checkout -- client/VERSION
          if [ -n "$(git status --porcelain -- client/VERSION)" ]; then
            echo "client/VERSION is still modified after restore"; exit 1
          fi
          echo "client/VERSION restored: $(cat client/VERSION)"

      - name: Check build outputs
        run: |
          foreach ($p in "client/dist/old/client_agent.exe", "client/dist/new/client_agent.exe") {
            if (-not (Test-Path $p)) { throw "$p not found" }
          }
          Get-FileHash -Algorithm SHA256 client/dist/old/client_agent.exe, client/dist/new/client_agent.exe | Format-Table Hash, Path

      # Тест сам поднимает стаб на 127.0.0.1:8000 и запускает exe; -s — чтобы
      # вывод агента ([update] ...) попадал в лог джобы.
      - name: Run self-update end-to-end test
        env:
          MONITORING_SELFUPDATE_E2E_OLD_EXE: ${{ github.workspace }}\client\dist\old\client_agent.exe
          MONITORING_SELFUPDATE_E2E_NEW_EXE: ${{ github.workspace }}\client\dist\new\client_agent.exe
          MONITORING_SELFUPDATE_E2E_NEW_VERSION: ${{ steps.new_version.outputs.version }}
        run: python -m pytest client/tests/test_selfupdate_e2e.py -v -ra -s

  # Определяет, менялось ли что-то в client/** в этом push (только push в master).
  # Выполняется на GitHub-раннере, чтобы self-hosted раннер не занимался пустыми прогонами.
  detect-client-changes:
    name: Detect client changes
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    outputs:
      client_changed: ${{ steps.diff.outputs.client_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before" 2>/dev/null; then
            echo "no usable base commit, treating client as changed"
            echo "client_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$before" "${{ github.sha }}" -- client/; then
            echo "client_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "client_changed=true" >> "$GITHUB_OUTPUT"
          fi
          git diff --stat "$before" "${{ github.sha }}" -- client/ || true

  # Публикация собранного агента на сервер мониторинга с self-hosted раннера.
  #
  # БЕЗОПАСНОСТЬ (репозиторий публичный, раннер стоит на личной машине):
  #  - запускается ТОЛЬКО на push в master этого репозитория с изменениями в client/**;
  #  - никогда на pull_request (условие ниже) и никогда по workflow_dispatch
  #    (такого триггера у workflow нет вообще);
  #  - нужен раннер с меткой monitoring-publisher, чтобы другие джобы на него не попадали.
  # Условие в файле защищает от случайного запуска; от злонамеренного PR из форка
  # (который может привезти свой ci.yml) защищает только настройка репозитория
  # Settings -> Actions -> "Require approval for all external contributors".
  publish-client-release:
    name: Publish client release (self-hosted)
    needs: [test, build-windows-agent, selfupdate-e2e-windows, detect-client-changes]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      github.repository == 'ddyonth/monitoring-project' &&
      needs.detect-client-changes.outputs.client_changed == 'true'
    runs-on: [self-hosted, linux, monitoring-publisher]
    steps:
      - uses: actions/checkout@v4

      # Тот же артефакт, что собрала джоба build-windows-agent в этом прогоне
      - uses: actions/download-artifact@v4
        with:
          name: client_agent-windows
          path: release

      # Версия — из client/VERSION того же коммита, из которого собран exe
      - name: Read client version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < client/VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "client version: $version"
          test -s release/client_agent.exe
          sha256sum release/client_agent.exe

      - name: Publish to monitoring server
        shell: bash
        env:
          MONITORING_SERVER_URL: ${{ secrets.MONITORING_SERVER_URL }}
          MONITORING_API_KEY: ${{ secrets.MONITORING_API_KEY }}
        run: |
          test -n "$MONITORING_SERVER_URL" || { echo "secret MONITORING_SERVER_URL is not set"; exit 1; }
          test -n "$MONITORING_API_KEY" || { echo "secret MONITORING_API_KEY is not set"; exit 1; }
          curl -sS --fail-with-body --max-time 300 \
            -X POST \
            -H "X-API-Key: $MONITORING_API_KEY" \
            -F "version=${{ steps.version.outputs.version }}" \
            -F "file=@release/client_agent.exe" \
            "${MONITORING_SERVER_URL%/}/api/client-release"
