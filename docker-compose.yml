services:
  postgres:
    # PostgreSQL 18 — актуальная стабильная мажорная версия на момент миграции (сентябрь 2026)
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monitoring}
      # Пароль только из окружения хоста или .env (см. .env.example)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in host environment or .env}
      POSTGRES_DB: ${POSTGRES_DB:-monitoring}
      # Локаль C.UTF-8: сортировка и сравнение TEXT по кодам символов, как в SQLite
      # (BINARY). Даты хранятся как TEXT и сравниваются как строки — порядок
      # должен совпадать с прежним.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monitoring} -d ${POSTGRES_DB:-monitoring}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: base
    image: monitoring-server:local
    ports:
      - "8000:8000"
    environment:
      # Секреты берутся из окружения хоста (или из .env рядом с этим файлом,
      # см. .env.example). Без MONITORING_API_KEY compose откажется стартовать.
      MONITORING_API_KEY: ${MONITORING_API_KEY:?set MONITORING_API_KEY in host environment or .env}
      MONITORING_CLIENT_UPDATE_KEY: ${MONITORING_CLIENT_UPDATE_KEY:-}
      MONITORING_DATABASE_URL: postgresql://${POSTGRES_USER:-monitoring}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-monitoring}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Прогон тестов внутри контейнера: docker compose run --rm tests
  tests:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: test
    image: monitoring-server:test
    profiles: ["test"]
    command: ["python", "-m", "pytest", "tests", "-v"]

volumes:
  postgres_data:
