<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Monitoring Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; }
    .card {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 12px;
  min-width: 320px;
  max-width: 100vw;   /* важно */
  overflow: visible;  /* важно: иначе режет таблицу */
}
    .muted { color: #666; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { border-bottom: 1px solid #eee; padding: 6px 8px; text-align: left; vertical-align: top; }
    th { background: #fafafa; position: sticky; top: 0; z-index: 1; }
    .badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid #ddd;
  font-size: 12px;
  background: #fff;
}
    .error { color: #b00020; white-space: pre-wrap; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; }

    /* tabs */
    .tabsbar { display:flex; gap:8px; margin-bottom:12px; }
    .tabbtn { padding:8px 12px; border-radius:999px; border:1px solid #ddd; background:#fff; cursor:pointer; }
    .tabbtn.active { background:#111; color:#fff; border-color:#111; }
    .tab { display:none; }
    .tab.active { display:block; }

    /* small inputs */
    input[type="text"], input[type="number"], select {
      padding: 6px 10px; border-radius: 999px; border: 1px solid #ddd; font-size: 13px;
    }
    label.chk { display:inline-flex; align-items:center; gap:6px; margin-right:10px; }

    .machineHeader { display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
    .machineTitle { font-weight: 700; font-size: 15px; }
    .machineMeta { display:flex; flex-direction:column; gap:4px; align-items:flex-start; }
    .pill { border:1px solid #ddd; border-radius:999px; padding:2px 8px; font-size:12px; background:#fff; }
    .pill.on { border-color:#2e7d32; color:#2e7d32; }
    .pill.off { border-color:#b00020; color:#b00020; }
    .pill.warn { border-color:#b00020; color:#b00020; background:#efd6d6; font-weight:700; }
    .pill.medwarn { border-color:#b58900; color:#8a6d00; background:#fff7d6; font-weight:700; }
    .hint { font-size:12px; color:#666; }

    details > summary { cursor:pointer; list-style:none; }
    details summary::-webkit-details-marker { display:none; }
    .machineDetails { margin-top: 10px; }

    /* ===== Monitoring: wide tables should not be clipped ===== */
.machineDetails {
	  max-width: 100vw;
	}

	/* контент раскрытой карточки — даём ширину окна */
	.machineDetails > * {
	  max-width: 100vw;
	}

	/* обёртка для таблиц процессов */
	.tableWrap {
	  width: 100%;
	  max-width: 100vw;
	  overflow-x: auto;
	  overflow-y: visible;
	  -webkit-overflow-scrolling: touch;
	}

	/* таблица внутри должна расширяться по содержимому */
	.tableWrap table {
	  min-width: 900px;
	  width: max-content;
	}

    /* Unknown process highlight (not in process_catalog) */
    tr.unknownProc td:first-child b { color: #b00020; }
    .unknownMark { color:#b00020; font-weight:700; margin-left:6px; }


    /* Type filter should look like a regular dropdown */
    /* class is on <details>, not on a wrapper */
    .typeSelect { position: relative; }
    .typeSelect > summary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #ddd;
      background: #fff;
      font-size: 13px;
      color: #111;
      user-select: none;
    }
    .typeSelect > summary::after {
      content: "▾";
      color: #666;
      margin-left: 2px;
    }
    .typeSelect[open] > summary::after { content: "▴"; }

    .typeSelect > #typeFilterList {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 10;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

  </style>
</head>
<body>
  <div class="topbar">
    <div>
      <h2 style="margin:0;">Панель мониторинга</h2>
      <div class="muted">Автообновление: <span id="refreshLabel">120 сек</span></div>
    </div>
  </div>

  <div class="tabsbar">
    <button class="tabbtn active" data-tab="monitoring">Мониторинг</button>
    <button class="tabbtn" data-tab="analytics">Аналитика</button>
    <button class="tabbtn" data-tab="settings">Настройки</button>
  </div>

  <div id="tab-monitoring" class="tab active">
    <div class="badge" style="margin-bottom:10px; display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
      <span class="muted">Фильтры:</span>

      <label class="muted">Процесс:</label>
      <select id="procSel"><option value="">(все)</option></select>

      <label class="muted">Показывать:</label>
      <select id="procStateSel">
        <option value="all">Все</option>
        <option value="running">Запущенные</option>
        <option value="stopped">Завершённые</option>
      </select>

      <details id="typeFilter" class="typeSelect" style="display:inline-block;">
        <summary>Тип процесса</summary>
        <div id="typeFilterList" style="padding:8px 10px; min-width:220px;">
          <div class="muted">загрузка...</div>
        </div>
      </details>

      <label class="muted">Статус машины:</label>
      <select id="statusSel">
        <option value="all">Все</option>
        <option value="online">Онлайн</option>
        <option value="offline">Оффлайн</option>
      </select>

      <label class="muted">Сортировка:</label>
      <select id="sortSel">
        <option value="machine_az">Машина A→Z</option>
        <option value="machine_za">Машина Z→A</option>
        <option value="last_new">Последнее обновление (новые)</option>
        <option value="last_old">Последнее обновление (старые)</option>
      </select>

      <button id="refreshBtn" style="padding:6px 10px; border-radius:999px; border:1px solid #ddd; cursor:pointer;">
        Обновить
      </button>

      <span id="status" class="muted"></span>
    </div>

    <div class="badge" style="margin-bottom:10px;">
      <span class="muted">Колонки процессов:</span>
      <label class="chk"><input type="checkbox" data-col="user" checked> User</label>
      <label class="chk"><input type="checkbox" data-col="start" checked> Start</label>
      <label class="chk"><input type="checkbox" data-col="duration" checked> Duration</label>
      <label class="chk"><input type="checkbox" data-col="pid" checked> PID</label>
      <label class="chk"><input type="checkbox" data-col="ppid"> PPID</label>
      <label class="chk"><input type="checkbox" data-col="path"> Path</label>
      <label class="chk"><input type="checkbox" data-col="sha256"> SHA256</label>
      <label class="chk"><input type="checkbox" data-col="cpu"> CPU (u/s)</label>
      <label class="chk"><input type="checkbox" data-col="cpu_delta"> CPU Δ</label>
      <label class="chk"><input type="checkbox" data-col="rss"> RSS</label>
      <label class="chk"><input type="checkbox" data-col="io"> IO</label>
      <label class="chk"><input type="checkbox" data-col="type"> Тип</label>
      <label class="chk"><input type="checkbox" data-col="desc"> Описание</label>
      <label class="chk"><input type="checkbox" data-col="net"> Net</label>
    </div>

    <div id="error" class="error"></div>
    <div id="cards" class="row"></div>
  </div>

  <div id="tab-analytics" class="tab">
    <div id="analyticsRoot"></div>
  </div>

  <div id="tab-settings" class="tab">
    <div id="settingsRoot"></div>
  </div>

  <script src="/static/dashboard.js?v={{ build_id }}"></script>
  <script>
    window.REFRESH_SECONDS = {{ refresh_seconds }};
  </script>
</body>
</html>
