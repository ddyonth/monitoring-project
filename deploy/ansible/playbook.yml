---
- name: Deploy monitoring server
  hosts: app_servers
  become: true
  vars_files:
    # Вложенный список = альтернативы: Ansible подключает первый существующий
    # файл. Локально это vault.yml с секретами (зашифрован ansible-vault, не в
    # репозитории, см. vault.yml.example); в CI его нет, берётся vault.ci.yml
    # (пустой словарь), а секреты приходят через --extra-vars.
    - - group_vars/local/vault.yml
      - group_vars/local/vault.ci.yml
  roles:
    - monitoring_server
