---
# Некритичные переменные деплоя. Секретов здесь быть не должно —
# они лежат в group_vars/local/vault.yml (зашифрован ansible-vault).

# Куда разворачиваем сервер на целевом хосте (рабочий каталог docker compose)
deploy_dir: /opt/monitoring

# Откуда берётся код: корень репозитория относительно каталога плейбука
monitoring_src_dir: "{{ playbook_dir }}/../.."

# Имя СТАРОГО systemd-сервиса (venv-деплой) — роль его останавливает и удаляет
monitoring_service_name: monitoring-server

# Postgres в docker compose: пользователь и имя базы (значения по умолчанию
# как в .env.example); пароль — в vault (monitoring_postgres_password)
postgres_user: monitoring
postgres_db: monitoring

# Параметры, которые попадают в config.json на целевом хосте
monitoring_listen_host: 0.0.0.0
monitoring_listen_port: 8000
monitoring_web_refresh_seconds: 120
# Базовый URL дашборда для ссылки в email-уведомлениях (config.json:
# dashboard_base_url; в коде переопределяется env MONITORING_DASHBOARD_URL).
# Пустая строка = ссылки в письме нет. Пример: "http://monitoring.local:8000"
monitoring_dashboard_base_url: ""
