---
# Некритичные переменные деплоя. Секретов здесь быть не должно —
# они лежат в group_vars/local/vault.yml (зашифрован ansible-vault).

# Куда разворачиваем сервер на целевом хосте
deploy_dir: /opt/monitoring

# Системный интерпретатор, которым создаётся venv (пакет ставится через apt)
python_bin: python3
python_apt_packages:
  - python3
  - python3-venv

# Откуда берётся код: корень репозитория относительно каталога плейбука
monitoring_src_dir: "{{ playbook_dir }}/../.."

# Пользователь, от которого работает сервис (создаётся плейбуком)
monitoring_user: monitoring

# Имя systemd-сервиса
monitoring_service_name: monitoring-server

# Параметры, которые попадают в config.json на целевом хосте
monitoring_listen_host: 0.0.0.0
monitoring_listen_port: 8000
monitoring_web_refresh_seconds: 120
