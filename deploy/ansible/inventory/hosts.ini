# Инвентарь для деплоя сервера мониторинга.
#
# Сейчас цель — localhost внутри WSL2 (Ubuntu).
# Для деплоя на VPS заменить localhost на реальный IP/hostname, добавить
# ansible_user и ansible_ssh_private_key_file — остальная часть плейбука
# не меняется. Пример:
#   203.0.113.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_ed25519

[app_servers]
# ansible_become_exe: на Ubuntu 25.10+ /usr/bin/sudo по умолчанию — sudo-rs,
# который переформатирует подсказку пароля ("[sudo: <prompt>] Password:"),
# и Ansible её не распознаёт. Классический sudo лежит в /usr/bin/sudo.ws.
# На хосте с обычным sudo (большинство VPS) этот параметр не нужен.
localhost ansible_connection=local ansible_become_exe=/usr/bin/sudo.ws
