# Инвентарь для деплоя сервера мониторинга.
#
# Сейчас цель — localhost внутри WSL2 (Ubuntu).
# Для деплоя на VPS заменить localhost на реальный IP/hostname, добавить
# ansible_user и ansible_ssh_private_key_file — остальная часть плейбука
# не меняется. Пример:
#   203.0.113.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_ed25519

[app_servers]
localhost ansible_connection=local
